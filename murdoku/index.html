<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murdoku</title>
<meta name="description" content="Murdoku: a murder mystery logic puzzle. Place every suspect on the floor plan, one per row and column, and find who was alone with the victim. Solo cases or a two-phone race.">
<meta name="theme-color" content="#15202A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dapple">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Gaegu:wght@400;700&family=Special+Elite&display=swap">
<style>
/* Layout: a detective's desk at night. Case files are manila folders with typewritten notes and red pins,
   the floor plan is a pastel blueprint, and suspects are little blobs you drop into rooms (the Dapple family look). */
:root{
  --desk:#15202A; --surface:#1E2C38; --surface2:#263847; --line:#3A5163;
  --text:#F3EFE4; --soft:#AFC0C9; --acc:#FFD23F; --acc-d:#C59A12;
  --manila:#F3E2B6; --manila2:#EAD39C; --ink:#2A1F1A; --ink-soft:#6E5D4E;
  --red:#E0483F; --red-d:#A82E27; --good:#3CC489; --bad:#FF6A5F; --chalk:#F7F4EA; --p1:#FF7D6E; --p2:#56A6E2;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --hand:"Gaegu","Chalkboard SE","Comic Sans MS",cursive;
  --type:"Special Elite","Courier New",Courier,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;color:var(--text);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background-color:var(--desk);
  background-image:radial-gradient(640px 460px at 85% -10%,rgba(255,210,63,.13),transparent 62%),radial-gradient(600px 480px at 0% 45%,rgba(224,72,63,.08),transparent 60%),
    linear-gradient(rgba(175,192,201,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(175,192,201,.05) 1px,transparent 1px);
  background-size:auto,auto,26px 26px,26px 26px;background-attachment:fixed;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
body.online{padding-top:calc(56px + env(safe-area-inset-top,0px))}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1.04;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:clamp(28px,8vw,40px)}
h3{font-size:22px}
p{margin:0}
.muted{color:var(--soft)}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.stack{display:flex;flex-direction:column;gap:10px}
.label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.hint{font-size:15px;color:var(--soft)}
.file .hint,.file .muted{color:var(--ink-soft)}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}

/* manila case file */
.file{background:var(--manila);color:var(--ink);border-radius:6px 16px 14px 14px;box-shadow:4px 6px 0 #0B1218,0 14px 30px rgba(0,0,0,.35);position:relative;padding:18px;
  background-image:radial-gradient(rgba(110,93,78,.10) 1px,transparent 1.4px);background-size:7px 7px}
.file.tab{margin-top:14px}
.file.tab::after{content:attr(data-tab);position:absolute;left:18px;top:-24px;height:26px;padding:3px 14px 0;background:var(--manila);border-radius:10px 10px 0 0;font-family:var(--type);font-size:14px;color:var(--ink-soft);white-space:nowrap}
.pin{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF8C84,var(--red) 55%,var(--red-d));box-shadow:1px 3px 2px rgba(0,0,0,.35);right:16px;top:-6px;z-index:3}
.type{font-family:var(--type);letter-spacing:.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}

.btn{appearance:none;border:0;cursor:pointer;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1;color:var(--ink);background:var(--acc);
  border-radius:999px;padding:12px 24px 13px;box-shadow:0 5px 0 var(--acc-d),0 10px 22px rgba(0,0,0,.35);transition:transform .1s,box-shadow .1s,opacity .2s;position:relative;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--acc-d),0 4px 10px rgba(0,0,0,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.red{background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red-d),0 10px 22px rgba(0,0,0,.35)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:active{transform:translateY(2px)}
.file .btn.ghost{color:var(--ink);box-shadow:inset 0 0 0 2.5px var(--ink)}
.btn.small{font-size:15px;padding:8px 14px 9px}
.btn.wide{width:100%}
.link{appearance:none;background:none;border:0;font:inherit;color:var(--soft);text-decoration:underline;text-decoration-color:rgba(175,192,201,.5);text-underline-offset:5px;cursor:pointer;padding:6px}
.file .link{color:var(--ink-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}

/* home */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
#heroBoard{width:min(300px,82vw);display:block;overflow:visible;cursor:pointer;touch-action:manipulation}
#heroBoard .tok{transition:transform .7s cubic-bezier(.4,1.5,.5,1)}
#heroBoard .chalkfig{animation:breathe 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{50%{opacity:.55}}
.logo{font-size:clamp(52px,15vw,78px);display:flex;justify-content:center;align-items:baseline;line-height:.95;margin-top:2px}
.logo span{display:inline-block;animation:drop .7s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*55ms)}
.logo .ku{font-family:var(--hand);font-weight:700;color:var(--ink);background:var(--acc);padding:0 .14em .04em;margin-left:.05em;border-radius:12px 16px 11px 17px/16px 11px 17px 12px;rotate:-6deg;box-shadow:3px 4px 0 #0B1218;border:3px solid var(--ink)}
@keyframes drop{from{opacity:0;transform:translateY(-36px) rotate(-10deg)}}
.tag{font-size:17px;color:var(--soft);max-width:34ch}
.tag i{font-family:var(--hand);font-style:normal;font-size:21px;color:var(--text)}
.tiles{display:grid;grid-template-columns:1fr;gap:12px}
.tile{appearance:none;font:inherit;text-align:left;cursor:pointer;display:flex;gap:14px;align-items:center;border:0;transition:transform .18s;width:100%}
.tile:nth-child(odd){rotate:-.5deg}.tile:nth-child(even){rotate:.4deg}
.tile:active{transform:scale(.98)}
.tile h3{font-size:21px}
.tile p{font-size:14px;color:var(--ink-soft);line-height:1.3}
.tile .meta{font-family:var(--type);font-size:13px;color:var(--ink-soft);margin-top:3px}
.tile .gridpic{width:58px;height:58px;flex:none}
.tile .go{margin-left:auto;font-weight:800;font-size:22px;flex:none}
.stamp{font-family:var(--type);font-size:12px;color:var(--red);border:2px solid var(--red);border-radius:4px;padding:1px 6px;rotate:-8deg;display:inline-block;margin-left:6px;vertical-align:2px}
.online-box{display:flex;flex-direction:column;gap:12px}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px;flex:1 1 200px;min-width:0}
input[type=text]{font:inherit;font-size:20px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);color:var(--text);width:100%}
input.code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-weight:800;font-size:28px;text-align:center}
.err{color:var(--bad);font-weight:700;min-height:1.2em;font-size:15px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{appearance:none;font:inherit;cursor:pointer;border-radius:14px;border:2px solid var(--line);background:var(--surface2);color:var(--text);padding:10px 6px;font-weight:700;line-height:1.2}
.seg button small{display:block;font-weight:500;color:var(--soft);font-size:12px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.seg button.on small{color:var(--ink-soft)}
.roomcode{display:flex;justify-content:center;gap:10px}
.roomcode span{font-family:var(--display);font-weight:800;font-size:44px;width:60px;height:72px;display:grid;place-items:center;background:var(--manila);color:var(--ink);border-radius:12px;box-shadow:3px 4px 0 #0B1218;animation:drop .6s cubic-bezier(.3,1.6,.5,1) both}
.roomcode span:nth-child(2){animation-delay:.08s}.roomcode span:nth-child(3){animation-delay:.16s}.roomcode span:nth-child(4){animation-delay:.24s}

/* the case screen */
.casebar{display:flex;align-items:center;gap:10px;justify-content:space-between}
.casebar .t{min-width:0}
.casebar h3{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.casebar .sub{font-family:var(--type);font-size:13px;color:var(--soft)}
.clock{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;background:var(--manila);color:var(--ink);border-radius:10px;padding:3px 10px;box-shadow:2px 3px 0 #0B1218;flex:none}
.clock.lock{background:var(--red);color:#fff}
.story{padding:14px 16px 14px;font-size:16px}
.story p{font-family:var(--type);font-size:15px;line-height:1.5}
.story .who{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.boardwrap{position:relative;filter:drop-shadow(4px 6px 0 #0B1218)}
#board{width:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none;border-radius:10px;overflow:visible}
#board .cell{cursor:pointer}
#board .tok{transform-box:fill-box;transform-origin:center}
#board .tok.drop{animation:tokdrop .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes tokdrop{0%{transform:translateY(-40%) scale(1.25);opacity:.2}100%{transform:none;opacity:1}}
#board .tok.sel{animation:lift 1s ease-in-out infinite}
@keyframes lift{50%{transform:translateY(-7%) scale(1.06)}}
#board .tok.clash .ring{stroke:var(--bad);stroke-width:7;animation:clash .5s ease-in-out 2}
@keyframes clash{50%{opacity:.3}}
#board .ripple{transform-box:fill-box;transform-origin:center;animation:ripple .5s ease-out forwards;pointer-events:none}
@keyframes ripple{from{transform:scale(.3);opacity:.9}to{transform:scale(1.25);opacity:0}}
#board .room-hl{animation:roomhl 1.1s ease-out forwards;pointer-events:none}
@keyframes roomhl{0%{opacity:.75}100%{opacity:0}}
.compass{position:absolute;right:-6px;top:-14px;width:38px;height:38px;background:var(--manila);border-radius:50%;box-shadow:2px 3px 0 #0B1218;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12px;color:var(--ink);z-index:2;pointer-events:none}
.compass svg{width:30px;height:30px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px 3px 4px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);cursor:pointer}
.legend i{width:16px;height:16px;border-radius:5px;display:inline-block;border:2px solid var(--ink)}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:999px;border:2px solid var(--line);background:var(--surface2);color:var(--text);font-weight:700;font-size:14px;transition:transform .15s,background .2s,opacity .2s}
.chip svg{width:32px;height:32px;flex:none}
.chip.sel{background:var(--acc);color:var(--ink);border-color:var(--acc);transform:translateY(-3px) rotate(-2deg)}
.chip.placed{opacity:.5}
.chip.placed.sel{opacity:1}
.chip.locked{opacity:.4;cursor:default}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tool{appearance:none;font:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text);font-weight:700;font-size:14px}
.tool.on{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.tool:disabled{opacity:.4;cursor:default}
.tool b{font-family:var(--display);font-size:17px}
.status{font-size:15px;color:var(--soft);min-height:1.45em}
.status b{color:var(--text)}
.clues{display:flex;flex-direction:column;gap:8px;padding:14px 12px 12px}
.clues h3{font-size:18px;display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.clues h3 small{font-family:var(--type);font-size:12px;font-weight:400;color:var(--ink-soft)}
.clue{appearance:none;font:inherit;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.45);border:1.5px dashed rgba(110,93,78,.45);color:var(--ink);font-family:var(--type);font-size:15px;line-height:1.35;transition:opacity .25s,background .25s,transform .2s;position:relative;width:100%}
.clue .faces{display:flex;flex:none}
.clue .faces svg{width:30px;height:30px}
.clue .faces svg+svg{margin-left:-10px}
.clue .no{font-family:var(--display);font-weight:800;font-size:13px;color:var(--ink-soft);flex:none;width:18px}
.clue b{font-weight:400;padding:0 3px;border-radius:4px;box-shadow:inset 0 -.45em 0 var(--hl,rgba(255,210,63,.6))}
.clue.done{opacity:.45}
.clue.done span.txt{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--red)}
.clue.bad{background:#FFD9D3;border-color:var(--red);border-style:solid;animation:shake .4s 2}
.clue.bad::after{content:"doesn't fit";position:absolute;right:8px;top:-9px;font-family:var(--hand);font-weight:700;font-size:15px;background:var(--red);color:#fff;padding:0 6px;border-radius:6px;rotate:3deg}
.clue.rule{background:rgba(42,31,26,.07);border-style:solid}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.accuse{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.accuse .hint{text-align:center}

/* overlays */
.lb{position:fixed;inset:0;background:rgba(9,14,19,.72);display:grid;place-items:center;padding:18px;z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.lb .file{width:min(520px,100%);max-height:92vh;overflow:auto;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.lineup{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.lineup button{appearance:none;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:2px solid var(--ink);background:rgba(255,255,255,.5);color:var(--ink);font-weight:700;font-size:13px;line-height:1.15;text-align:center;transition:transform .15s}
.lineup button:active{transform:scale(.95)}
.lineup svg{width:58px;height:58px}
.lineup button:hover svg{animation:lift 1s ease-in-out infinite}
.bigstamp{position:fixed;left:50%;top:40%;z-index:60;font-family:var(--type);font-size:clamp(34px,11vw,56px);color:var(--red);border:6px double var(--red);border-radius:10px;padding:6px 18px;background:rgba(243,226,182,.92);
  transform:translate(-50%,-50%) rotate(-12deg);animation:stampin .5s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none;white-space:nowrap;text-align:center;line-height:1.1}
.bigstamp.no{color:var(--ink);border-color:var(--ink)}
@keyframes stampin{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(2.6);opacity:0}100%{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;max-width:min(92vw,460px);text-align:center;padding:10px 16px;font-size:15px;font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* race */
.opp{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.opp svg{width:34px;height:34px;flex:none}
.opp .bar{flex:1;height:12px;border-radius:999px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.opp .bar i{display:block;height:100%;background:var(--p2);border-radius:999px;transition:width .5s cubic-bezier(.3,1.5,.5,1)}
.opp .n{font-family:var(--display);font-weight:800;font-size:15px;white-space:nowrap}
.countdown{font-family:var(--display);font-weight:800;font-size:120px;text-align:center;color:var(--acc);animation:pop .5s cubic-bezier(.3,1.6,.5,1);line-height:1}
.tally{display:flex;justify-content:center;gap:16px;align-items:center;font-family:var(--display);font-weight:800;font-size:26px}
.tally small{font-size:14px;font-weight:700;color:var(--soft);display:block;text-align:center}
.file .tally small{color:var(--ink-soft)}
.results{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.results div{background:rgba(255,255,255,.4);border-radius:12px;padding:10px;text-align:center}
.results b{display:block;font-family:var(--display);font-size:24px}
#net{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;appearance:none;border:1px solid var(--line);font:inherit;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;background:var(--surface);color:var(--good);cursor:pointer;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#net.lost{color:var(--acc)}
.back{text-align:center;margin:26px 0 0;font-size:15px}
.back a{color:var(--soft);text-underline-offset:4px}

/* rules */
.rules ol{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:16px}
.rules li::marker{font-family:var(--display);font-weight:800}
.objs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.objs div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;background:rgba(255,255,255,.45);border-radius:10px;padding:8px 4px;text-align:center;line-height:1.2}
.objs div small{font-weight:500;color:var(--ink-soft);font-size:12px}
.objs svg{width:42px;height:42px}
.dot{width:120px;cursor:pointer;touch-action:manipulation}
.dot .lid{transform-box:fill-box;transform-origin:50% 0;animation:blink 4.8s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.dot .look{transition:transform .18s ease-out}
.dot.jump{animation:jumpy .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes jumpy{35%{transform:translateY(-16px) rotate(-6deg)}70%{transform:translateY(0) scale(1.05,.95)}}
@media (max-width:380px){.chip{font-size:13px;padding-right:9px}.chip svg{width:28px;height:28px}.clue{font-size:14px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wob" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<main id="app" aria-live="polite"></main>
<p class="back"><a href="../">‹ All games on Dapple</a></p>
<script>
(()=>{
'use strict';
/*ENGINE*/
function ENGINE_FACTORY(){

        worker.onmessage=e=>{const cb=worker.cbs[e.data.id];delete worker.cbs[e.data.id];cb&&cb(e.data.P);};
        worker.onerror=()=>{const cbs=worker.cbs;worker=null;Object.values(cbs).forEach(f=>f(null));};}
      const id=Math.random().toString(36).slice(2);
      worker.cbs[id]=P=>P?done(P):setTimeout(()=>done(ENGINE.generate(seed,diff)),30);

async function openSolo(d){

  let saved=store.get('case:'+key,null);
  if(!saved||!saved.P||!saved.P.people){loading(d==='daily'?"Opening today's case":`Opening case ${String(store.get('num:'+d,1)).padStart(3,'0')}`);
    const t=Date.now(),P=await genCase(diff,hashSeed('mdk|'+key));await new Promise(r=>setTimeout(r,Math.max(0,900-(Date.now()-t))));
    saved={P,S:freshState(P)};store.set('case:'+key,saved);}
  if(saved.S.done)return soloDone(d,key,saved);
  const {P,S}=saved;let start=Date.now()-S.ms;
  playCase(P,S,{title:d==='daily'?"Today's case":`${DIFF_INFO[diff].name} · case ${String(store.get('num:'+d,1)).padStart(3,'0')}`,sub:P.house,
    clock:()=>Date.now()-start,save:S2=>store.set('case:'+key,{P,S:S2}),onBack:home,
    onSolve:S2=>{const st=stats();if(d==='daily'){st.daily=(st.daily||[]).concat(today()).slice(-60);}else{const s=st[d]||{solved:0};s.solved=(s.solved||0)+1;if(!s.best||S2.ms<s.best)s.best=S2.ms;st[d]=s;store.set('case:'+key,null);store.set('num:'+d,store.get('num:'+d,1)+1);}store.set('stats',st);soloDone(d,key,{P,S:S2});}});
}
function soloDone(d,key,{P,S}){
  const V=P.n-1,k=P.murderer;
  show(`<section class="file tab pop" data-tab="Case closed"><span class="pin"></span>
    <div class="row" style="gap:14px;flex-wrap:nowrap">${charSVG(P.people[k].ci,{mood:'smug',cls:'killer'}).replace('<svg','<svg style="width:96px;flex:none"')}<div><h2 style="font-size:30px">${esc(P.people[k].full)} did it!</h2>
    <p class="type" style="font-size:15px;margin-top:6px">Alone with ${esc(P.people[V].first)} in the ${esc(P.roomNames[P.room[P.sol[V]]])}, with ${esc(P.weapon)}.</p></div></div>
    <div class="results" style="margin-top:14px"><div><b>${fmt(S.ms)}</b>time</div><div><b>${S.hints?S.hints+' 🔍':S.wrong?S.wrong+' ✗':'★'}</b>${S.hints?'hunches used':S.wrong?'wrong accusations':'clean solve'}</div></div></section>
    <div class="boardwrap">${boardSVG(P,{pos:P.sol,marks:null,locked:[]},{static:true,helper:false,killer:k,solved:true})}</div>
    <div class="row c">${d==='daily'?'':'<button class="btn" id="next">Next case</button>'}<button class="btn ghost" id="home">Home</button></div>`);
  on('#home','click',home);

/* ---------- two phones: the same pairing the other Dapple games use ----------
   Phones find each other through PeerJS's free public broker, using the room code as the host's address.
   The room is one shared document that only the host's phone changes; each phone keeps a copy in local storage,
   so a reload or a locked screen never loses the race. The whole case travels inside that document, so both
   phones always solve exactly the same map. The guest's accusations are saved and sent again until the host has them. */
const PEER_PREFIX='mdk-k7q2-';
const LOCK_MS=20000;
const peerOpts=()=>Object.assign({debug:0},window.MDK_PEER_SERVER||{});
const DEVICE=(()=>{let d=store.get('device','');if(!d){d='d'+Math.random().toString(36).slice(2,12);store.set('device',d);}return d;})();
const NET={peer:null,conn:null,host:false,code:null,active:false,rejoin:null,doc:null,intents:{},key:'',off:0,ctrl:null};
const ME=()=>NET.host?0:1;
const up=()=>!!(NET.conn&&NET.conn.open);
const saveDoc=()=>store.set('doc:'+NET.code,NET.doc);
const saveIntents=()=>store.set('intents:'+NET.code,NET.intents);
const netEl=document.createElement('button');netEl.id='net';netEl.type='button';netEl.hidden=true;document.body.insertBefore(netEl,app);
netEl.addEventListener('click',()=>{if(NET.active)home();});
function reconnectNow(){if(NET.host)hostRoom();else{clearTimeout(NET.rejoin);NET.rejoin=null;scheduleRejoin(0);}}
function netStatus(){
  if(!NET.active){netEl.hidden=true;document.body.classList.remove('online');return;}
  netEl.hidden=false;document.body.classList.add('online');netEl.classList.toggle('lost',!up());
  const them=NET.doc&&NET.doc.names[1-ME()];
  netEl.textContent=up()?`● Room ${NET.code} · with ${them||'partner'} · menu`:(NET.host&&!(NET.doc&&NET.doc.guest))?`● Room ${NET.code} · waiting for partner`:`● Room ${NET.code} · reconnecting… · menu`;
}
const libs={};
function loadScript(src){if(!libs[src])libs[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete libs[src];rej(new Error('load'));};document.head.appendChild(s);});return libs[src];}
const LETTERS='ABCDEFGHJKMNPQRSTUVWXYZ';
const newCode=()=>Array.from({length:4},()=>LETTERS[Math.floor(Math.random()*LETTERS.length)]).join('');
function raw(m,c=NET.conn){if(c&&c.open){try{c.send(JSON.stringify(m));}catch(e){}}}
function wireConn(conn){
  conn.on('open',()=>{if(!NET.host){NET.conn=conn;raw({t:'hello',id:DEVICE,name:store.get('me','')});Object.values(NET.intents).forEach(it=>raw({t:'intent',it}));}keepAwake();netStatus();});
  conn.on('data',d=>{let m;try{m=typeof d==='string'?JSON.parse(d):d;}catch(e){return;}if(m&&typeof m==='object')(NET.host?hostGot:guestGot)(conn,m);});
  conn.on('close',()=>{if(NET.conn===conn){NET.conn=null;netStatus();renderOnline();scheduleRejoin();}});
  conn.on('error',()=>{});
}
async function hostRoom(){
  if(!NET.active||!NET.host)return;
  try{await loadScript('vendor/peerjs.min.js');}catch(e){netEl.textContent='● Couldn\'t load the connection code. Tap to retry.';netEl.classList.add('lost');return;}
  if(!NET.active||!NET.host)return;
  if(NET.peer&&!NET.peer.destroyed&&NET.peer.open)return;
  if(NET.peer){try{NET.peer.destroy();}catch(e){}}
  const p=new Peer(PEER_PREFIX+NET.code,peerOpts());NET.peer=p;
  p.on('open',()=>netStatus());
  p.on('connection',conn=>wireConn(conn));
  p.on('disconnected',()=>setTimeout(()=>{if(NET.peer===p&&!p.destroyed){try{p.reconnect();}catch(e){}}},3000));
  p.on('error',e=>{if(NET.peer!==p||e.type==='peer-unavailable')return;setTimeout(()=>{if(NET.peer===p&&NET.active){try{p.destroy();}catch(x){}NET.peer=null;hostRoom();}},4000);});
}
function joinPeer(code){
  return loadScript('vendor/peerjs.min.js').then(()=>new Promise(res=>{
    if(NET.peer){try{NET.peer.destroy();}catch(e){}}
    const p=new Peer(peerOpts());NET.peer=p;let done=false;
    const fin=msg=>{if(done)return;done=true;clearTimeout(t);if(msg){try{p.destroy();}catch(e){}if(NET.peer===p)NET.peer=null;}res(msg||null);};
    const t=setTimeout(()=>fin(`Couldn't reach room ${code}. Check the code, and ask your partner to keep Murdoku open on their screen.`),20000);
    p.on('error',e=>fin(e.type==='peer-unavailable'?`Can't find room ${code}. Check the code, and ask your partner to keep Murdoku open on their screen.`:'Couldn\'t connect. Check your internet and try again.'));
    p.on('open',()=>{const conn=p.connect(PEER_PREFIX+code,{serialization:'raw',reliable:true});wireConn(conn);conn.on('open',()=>fin(null));});
  }),()=>'Couldn\'t load the connection code. Check your internet and try again.');
}
function scheduleRejoin(ms=2500){
  if(NET.host||!NET.active||NET.rejoin||up())return;
  NET.rejoin=setTimeout(async()=>{const err=await joinPeer(NET.code);NET.rejoin=null;NET.fails=err?(NET.fails||0)+1:0;netStatus();renderOnline();if(err&&NET.active&&!up())scheduleRejoin();},ms);
}
let wake=null;
async function keepAwake(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!NET.active)return;keepAwake();
  if(NET.host){if(!NET.peer||NET.peer.destroyed)hostRoom();else if(NET.peer.disconnected){try{NET.peer.reconnect();}catch(e){}}}
  else if(!up())scheduleRejoin(0);
});
setInterval(()=>{if(document.visibilityState!=='visible'||!NET.active)return;if(NET.host){if(!NET.peer||NET.peer.destroyed)hostRoom();}else if(!up())scheduleRejoin();},6000);
function hostGot(conn,m){
  const d=NET.doc;if(!d)return;
  if(m.t==='hello'){
    if(d.guest&&d.guest!==m.id){raw({t:'full'},conn);setTimeout(()=>{try{conn.close();}catch(e){}},300);return;}
    if(NET.conn&&NET.conn!==conn){const old=NET.conn;NET.conn=null;try{old.close();}catch(e){}}
    NET.conn=conn;conn.guestId=m.id;
    if(!d.guest||d.names[1]!==String(m.name||'').slice(0,18)){d.guest=m.id;d.names[1]=String(m.name||'Partner').slice(0,18)||'Partner';commit();}
    else raw({t:'doc',doc:d,now:Date.now()});
    netStatus();return;
  }
  if(conn!==NET.conn||conn.guestId!==d.guest)return;
  if(m.t==='intent'&&m.it)apply(1,m.it);
}
function commit(){NET.doc.v++;saveDoc();raw({t:'doc',doc:NET.doc,now:Date.now()});netStatus();renderOnline();}
async function startRace(){
  const d=NET.doc;if(!d.guest||NET.starting)return;NET.starting=true;NET.key='gen';loading('Writing up a new case');
  const P=await genCase(d.diff||'medium',(Math.random()*4294967295)>>>0);NET.starting=false;
  if(!NET.active||!NET.host)return;
  d.game={gid:Math.random().toString(36).slice(2,9),P,t0:Date.now()+4500,ms:[null,null],wrong:[0,0],prog:[0,0],winner:-1};commit();
}
function apply(seat,it){
  const d=NET.doc;if(!it||typeof it!=='object')return;const G=d.game;
  if(it.k==='leave'&&seat===1){d.guest=null;d.names[1]='';d.game=null;return commit();}
  if(it.k==='lobby'&&G&&(seat===0||G.winner>=0)){d.game=null;return commit();}
  if(!G||it.gid!==G.gid)return;
  if(it.k==='prog'&&typeof it.n==='number'&&G.prog[seat]!==it.n){G.prog[seat]=Math.max(0,Math.min(G.P.n,it.n|0));return commit();}
  if(it.k==='wrong'&&typeof it.c==='number'&&it.c>G.wrong[seat]){G.wrong[seat]=it.c|0;return commit();}
  if(it.k==='solve'&&G.winner<0&&Array.isArray(it.pos)&&samePos(it.pos,G.P.sol)&&it.pick===G.P.murderer){
    G.winner=seat;G.ms[seat]=Math.max(0,+it.ms||0);d.wins[seat]=(d.wins[seat]||0)+1;return commit();}
}
function guestGot(conn,m){
  if(m.t==='doc'&&m.doc&&Array.isArray(m.doc.names)){
    if(typeof m.now==='number')NET.off=Date.now()-m.now;
    if(!NET.doc||m.doc.v>=NET.doc.v||m.doc.code!==NET.doc.code){NET.doc=m.doc;saveDoc();pruneIntents();netStatus();renderOnline();}
    if(NET.joinWait){const w=NET.joinWait;NET.joinWait=null;w();}
  }
  else if(m.t==='full'){if(NET.joinWait){const w=NET.joinWait;NET.joinWait=null;w('That room already has two players.');}}
  else if(m.t==='closed'){const who=NET.doc&&NET.doc.names[0]||'Your partner';clearRoom();home();toast(`${who} closed the room.`);}
}
function stale(it,G){
  if(it.k==='lobby')return !G||G.gid!==it.gid;
  if(!G||it.gid!==G.gid)return true;
  if(it.k==='solve')return G.winner>=0;
  if(it.k==='wrong')return G.wrong[1]>=it.c;
  return true;
}
function pruneIntents(){
  const G=NET.doc.game;let ch=false;
  for(const k of Object.keys(NET.intents)){if(k==='leave')continue;if(stale(NET.intents[k],G)){delete NET.intents[k];ch=true;}}
  if(ch)saveIntents();
}
function act(it,keep=true){NET.away=false;if(NET.host){apply(0,it);return;}if(keep){NET.intents[it.k]=it;saveIntents();}raw({t:'intent',it});}
function setRoom(code,host){NET.away=false;NET.code=code;NET.host=host;NET.active=true;NET.key='';NET.fails=0;NET.off=0;store.set('room',{code,host});NET.intents=store.get('intents:'+code,{});}
function clearRoom(){
  const c=NET.conn,p=NET.peer,code=NET.code;NET.conn=null;NET.peer=null;NET.active=false;clearTimeout(NET.rejoin);NET.rejoin=null;
  NET.doc=null;NET.intents={};NET.key='';NET.ctrl=null;store.set('room',null);if(code){store.set('doc:'+code,null);store.set('intents:'+code,null);}
  setTimeout(()=>{try{c&&c.close();}catch(e){}try{p&&p.destroy();}catch(e){}},300);netStatus();
}
function leaveRoom(){if(NET.host)raw({t:'closed'});else raw({t:'intent',it:{k:'leave'}});clearRoom();home();}
function bootOnline(){
  const r=store.get('room',null);if(!r||!r.code)return false;
  setRoom(r.code,!!r.host);NET.doc=store.get('doc:'+r.code,null);
  if(NET.host&&!NET.doc){clearRoom();return false;}
  netStatus();
  if(NET.doc&&NET.doc.game&&NET.doc.game.winner>=0){NET.away=true;home();}else renderOnline();
  if(NET.host)hostRoom();else scheduleRejoin(0);
  return true;
}
function roomName(host,err=''){
  show(`<h2>${host?'Start a room':'Join a room'}</h2><section class="card stack" style="gap:14px">
    <label class="f">Your name<input type="text" id="me" maxlength="18" placeholder="Your name" autocomplete="nickname" value="${esc(store.get('me',''))}"></label>
    ${host?'<p class="hint">You get a four-letter code to give your partner.</p>':'<label class="f">Room code<input type="text" class="code" id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD"></label>'}
    <p class="err" id="err">${err}</p>
    <div class="row"><button class="btn" id="go">${host?'Open the room':'Join'}</button><button class="link" id="back">Back</button></div></section>`);
  on('#back','click',home);
  on('#go','click',async()=>{
    const me=$('#me').value.trim(),e=$('#err');
    if(!me){e.textContent='Add your name so your partner knows who they are racing.';return;}
    store.set('me',me);
    if(NET.active)leaveRoom();
    if(host){const code=newCode();setRoom(code,true);NET.doc={v:1,code,names:[me,''],guest:null,game:null,wins:[0,0],diff:'medium'};saveDoc();netStatus();renderOnline();hostRoom();return;}
    const code=$('#code').value.toUpperCase().replace(/[^A-Z]/g,'');
    if(code.length!==4){e.textContent='Room codes are 4 letters.';return;}
    const b=$('#go');b.disabled=true;b.textContent='Joining…';e.textContent='';
    setRoom(code,false);NET.doc=null;
    let msg=await joinPeer(code);
    if(!msg)msg=await new Promise(res=>{NET.joinWait=res;setTimeout(()=>{if(NET.joinWait===res){NET.joinWait=null;res('The room didn\'t answer. Try again.');}},10000);});
    if(msg){clearRoom();b.disabled=false;b.textContent='Join';e.textContent=msg;return;}
    keepAwake();netStatus();renderOnline();
  });
}
const t0Local=G=>G.t0+(NET.host?0:NET.off);
function raceState(G){const k='race:'+G.gid;let S=store.get(k,null);if(!S){S=freshState(G.P);S.lockUntil=0;}return S;}
function renderOnline(){
  if(!NET.active)return;
  const d=NET.doc,me=ME(),them=1-me;let key,draw;
  if(NET.starting&&NET.key==='gen')return;
  if(!NET.host&&!up()&&(NET.fails||0)>=2){const hn=esc(d&&d.names[0]||'your partner');key='gone';draw=()=>{show(`<section class="file pop center stack"><span class="pin"></span>${charSVG(9,{mood:'worried'}).replace('<svg','<svg style="width:90px;margin:0 auto"')}<h2>Can't reach ${hn}'s room</h2>
      <p class="hint">${hn}'s phone may have closed the game. It keeps trying in the background.</p>
      <div class="row c"><button class="btn" id="retry">Try again now</button><button class="btn ghost" id="leave">Leave the room</button></div><button class="link" id="home">Home</button></section>`);
    on('#retry','click',reconnectNow);on('#leave','click',leaveRoom);on('#home','click',home);};}
  else if(!d){key='connecting';draw=()=>waitScreen(`Joining room ${esc(NET.code)}…`);}
  else if(!NET.host&&d.guest&&d.guest!==DEVICE){key='full';draw=()=>{show(`<section class="file stack center"><h2>That room is full</h2><p class="hint">Someone else is racing ${esc(d.names[0])} in room ${esc(NET.code)}.</p><button class="btn" id="leave">OK</button></section>`);on('#leave','click',leaveRoom);};}
  else if(!d.game){key=`lobby|${d.names.join('|')}|${!!d.guest}|${up()}|${d.diff}|${d.wins.join()}`;draw=lobby;}
  else{
    const G=d.game;
    if(G.winner>=0){key=`over|${G.gid}`;draw=()=>raceOver(G);}
    else if(Date.now()<t0Local(G)){key=`cd|${G.gid}`;draw=()=>countdown(G);}
    else if(raceState(G).done){key=`sent|${G.gid}`;draw=()=>waitScreen(up()||NET.host?'Case closed! Telling the room…':'Case closed! Waiting to reach the room…');}
    else{key=`play|${G.gid}`;draw=()=>racePlay(G);}
  }
  if(NET.away)return;
  if(key!==NET.key){NET.key=key;NET.ctrl=null;draw();}
  else if(NET.ctrl)NET.ctrl.opp();
}
function oppHTML(G){const them=1-ME(),nmT=NET.doc.names[them]||'Partner',n=G.P.n,k=G.prog[them]||0;
  return `<div class="opp">${charSVG(them?13:2)}<div style="flex:1;min-width:0"><div class="n">${esc(nmT)}${G.wrong[them]?` · ${G.wrong[them]} wrong`:''}</div><div class="bar"><i style="width:${k/n*100}%"></i></div></div><span class="n">${k}/${n}</span></div>`;}
function countdown(G){
  show(`<section class="file center pop stack" style="padding:26px 18px"><span class="pin"></span><p class="type">A new case at ${esc(G.P.house)}</p><div class="countdown" id="cd">3</div><p class="hint">Same map, same clues on both phones. First to name the killer wins.</p></section>`);
  const tick=()=>{const left=t0Local(G)-Date.now(),el=$('#cd');if(!el)return;if(left<=0){NET.key='';renderOnline();return;}const s=Math.ceil(left/1000);if(el.textContent!==String(s)){el.textContent=s>3?'…':s;el.style.animation='none';void el.offsetWidth;el.style.animation='';buzz(10);}later(tick,100);};tick();
}
function racePlay(G){
  const S=raceState(G),me=ME(),k='race:'+G.gid,base=t0Local(G);
  let lastN=-1;
  NET.ctrl=playCase(G.P,S,{race:true,hints:false,title:`Race · ${NET.doc.names[0]} v ${NET.doc.names[1]}`,sub:G.P.house,
    clock:()=>Date.now()-base,lockUntil:()=>S.lockUntil||0,
    save:S2=>store.set(k,S2),onBack:home,oppHTML:()=>oppHTML(NET.doc.game&&NET.doc.game.gid===G.gid?NET.doc.game:G),
    onChange:S2=>{const n=S2.pos.filter(c=>c>=0).length;if(n!==lastN){lastN=n;act({k:'prog',gid:G.gid,n},false);}},

function raceOver(G){

    show(`<h2 class="center">Your room</h2><div class="roomcode" aria-label="Room code ${NET.code}">${[...NET.code].map(c=>`<span>${c}</span>`).join('')}</div>
      <p class="center muted">Your partner opens Murdoku, taps <b>Join a room</b> and types this code.</p>
      <div class="row c">${d.guest?`${charSVG(13,{mood:live?'happy':'worried'}).replace('<svg','<svg style="width:54px"')}<h3>${esc(d.names[1])} ${live?'is here!':'is reconnecting…'}</h3>`:`<h3 class="muted">Waiting for your partner…</h3>`}</div>
      ${score}<section class="card stack" style="gap:12px"><span class="label">Difficulty</span>${seg}<button class="btn wide" id="start" ${d.guest?'':'disabled'}>Start the race</button></section>
      <div class="row c"><button class="link" id="leave">Close the room</button><button class="link" id="home">Home</button></div>`);
    on('#start','click',startRace);
    on('#seg','click',e=>{const b=e.target.closest('button[data-d]');if(!b)return;d.diff=b.dataset.d;commit();});
  }else{
    show(`<section class="file pop center stack"><span class="pin"></span>${charSVG(13).replace('<svg','<svg style="width:80px;margin:0 auto"')}<h2>You're in room ${esc(NET.code)}</h2>
      <p class="hint">The race starts on both phones when ${esc(d.names[0])} taps start.</p>${seg}${score}
      <div class="row c"><button class="link" id="leave">Leave the room</button><button class="link" id="home">Home</button></div></section>`);
  }
  on('#leave','click',leaveRoom);on('#home','click',home);
}
function waitScreen(text){
  show(`<section class="file pop center stack"><span class="pin"></span>${charSVG(ME()?13:2).replace('<svg','<svg style="width:80px;margin:0 auto"')}<h2>${text}</h2>
    <p class="hint">Keep the game open. It moves on by itself.</p><button class="link" id="wmenu">Room menu</button></section>`);
  on('#wmenu','click',home);
}
const homeBase=home;
home=function(){homeBase();if(!NET.active)return;NET.away=true;NET.ctrl=null;const box=$('.online-box');
  box.innerHTML=`<h3>You're in room ${esc(NET.code)}</h3>
    ${up()?'':`<p class="muted">Not connected to ${esc(NET.doc&&NET.doc.names[1-ME()]||'your partner')} right now.</p>`}<div class="row"><button class="btn" id="toroom">Back to the race</button>${up()?'':'<button class="btn ghost" id="recon">Reconnect</button>'}<button class="btn ghost" id="leave">${NET.host?'Close the room':'Leave the room'}</button></div>`;
  on('#recon','click',()=>{reconnectNow();toast('Reconnecting…');});
  on('#toroom','click',()=>{NET.away=false;NET.key='';renderOnline();});on('#leave','click',leaveRoom);};

/* ---------- stay up to date ----------
   Phones can keep an old copy of the page for a while. On opening (and on coming back to the app) it fetches the page
   fresh and compares build stamps. Straight after opening it just reloads; later it offers a button, so nobody is
   pulled out of a case. Everything is saved, so a reload never loses progress. */
const BUILD='2026-11-16e';
let updShown=false;
async function checkUpdate(boot){
  try{const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();const m=t.match(/const BUILD='([^']+)'/);
    if(!m||m[1]===BUILD)return;const go=()=>location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
    if(boot&&!sessionStorage.getItem('mdk:upd:'+m[1])){try{sessionStorage.setItem('mdk:upd:'+m[1],'1');}catch(e){}go();return;}
    if(updShown)return;updShown=true;const b=document.createElement('button');b.className='btn';b.textContent='New version ready. Tap to update';
    b.style.cssText='position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;white-space:nowrap';b.onclick=go;document.body.appendChild(b);
  }catch(e){}
}
setTimeout(()=>checkUpdate(true),400);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate(false);});
window.__mdk={ENGINE,genCase,dress,NET,CHARS,freshState,samePos};
if(!bootOnline())home();
})();
</script>
